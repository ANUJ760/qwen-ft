model:
  name: "Qwen/Qwen3-4B"
  max_seq_length: 4096

dataset:
  validation_split: 0.1
  seed: 42

lora:
  r: 16
  alpha: 32
  dropout: 0.05

  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

training:
  epochs: 3

  learning_rate: 0.0001

  train_batch_size: 1
  eval_batch_size: 1

  gradient_accumulation_steps: 8

  warmup_steps: 0

  gradient_checkpointing: true

  fp16: false
  bf16: true

  logging_steps: 5
  eval_steps: 50

  save_steps: 50
  save_total_limit: 2

output:
  directory: "finetune/checkpoints/experiment-report"